name: Build and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 1.2.0)
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: Resolve and validate version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION#v}"
            publish=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            version="$(node -p "require('./package.json').version")"
            publish=false
          fi

          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "Invalid version '$version'. Use a semantic version such as 1.2.0 or 1.2.0-beta.1." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Building WLSAPlus $version (publish: $publish)"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      WLSAPLUS_VERSION: ${{ needs.prepare.outputs.version }}
      WLSAPLUS_VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Require persistent Android signing
        shell: bash
        run: |
          for field in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!field}" ]; then
              echo "Missing repository secret: $field. Refusing to publish a temporary debug-signed APK." >&2
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.1', cache-dependency-path: phone-network/go.sum }
      - uses: android-actions/setup-android@v3
      - name: Install Android native toolchain
        run: sdkmanager 'ndk;28.2.13676358' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test phone network
        working-directory: phone-network
        run: go test -race ./...
      - name: Install phone relay test dependencies
        working-directory: phone-relay-worker
        run: npm ci
      - name: Test phone relay and native integration
        working-directory: phone-relay-worker
        run: |
          npm test
          npm run test:native
      - run: npm ci
      - run: npm run version:apply
      - run: npm run capacitor:sync
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" npm run phone:network:android
      - name: Restore Android signing key
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wlsaplus.jks"
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/wlsaplus.jks"
          ./gradlew assembleRelease
      - name: Verify Android release package
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/zipalign" -c -P 16 4 "$apk"
          badging="$("$tools/aapt" dump badging "$apk")"
          [[ "$badging" == *"package: name='cn.org.wlsash.wlsaplus'"* ]]
          [[ "$badging" != *"application-debuggable"* ]]
      - name: Stage APK
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/WLSAPlus-${WLSAPLUS_VERSION}-Android.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: release-assets/* }

  windows:
    needs: prepare
    runs-on: windows-latest
    env:
      WLSAPLUS_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.1', cache-dependency-path: phone-network/go.sum }
      - name: Test phone network
        working-directory: phone-network
        run: go test ./...
      - run: npm ci
      - run: npm run version:apply
      - run: npm test
      - run: npm run electron:make:windows
      - name: Add mirror cache key to update metadata
        run: npm run updates:cache-key
        env:
          WLSAPLUS_UPDATE_CACHE_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets
          $setup = Get-Item "out-builder/WLSAPlus-$env:WLSAPLUS_VERSION-Windows-Setup.exe"
          Copy-Item -LiteralPath $setup.FullName -Destination release-assets
          Get-ChildItem out-builder -File | Where-Object { $_.Name -eq 'latest.yml' -or $_.Extension -eq '.blockmap' } | Copy-Item -Destination release-assets
          if (-not (Test-Path release-assets/latest.yml)) { throw 'Windows update metadata was not produced.' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release-assets/*

  macos:
    needs: prepare
    runs-on: macos-latest
    env:
      WLSAPLUS_VERSION: ${{ needs.prepare.outputs.version }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run version:apply
      - name: Import Apple signing certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        run: |
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p actions "$RUNNER_TEMP/build.keychain"
          security default-keychain -s "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p actions "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$RUNNER_TEMP/build.keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$RUNNER_TEMP/build.keychain"
      - run: npm run electron:make
      - name: Stage macOS packages
        run: |
          mkdir -p release-assets
          dmg_path="$(find out/make -type f -name '*.dmg' | head -n 1)"
          zip_path="$(find out/make -type f -name '*.zip' | head -n 1)"
          test -n "$dmg_path" && cp "$dmg_path" "release-assets/WLSAPlus-${WLSAPLUS_VERSION}-macOS.dmg"
          test -n "$zip_path" && cp "$zip_path" "release-assets/WLSAPlus-${WLSAPLUS_VERSION}-macOS.zip"
          test -n "$dmg_path$zip_path"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release-assets/*

  release:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, android, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: WLSAPlus ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
