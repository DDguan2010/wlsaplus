name: Build and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 1.2.0)
        required: true
        type: string
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: Resolve and validate version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION#v}"
            publish=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            version="$(node -p "require('./package.json').version")"
            publish=false
          fi

          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "Invalid version '$version'. Use a semantic version such as 1.2.0 or 1.2.0-beta.1." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Building WLSAPlus $version (publish: $publish)"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      WLSAPLUS_VERSION: ${{ needs.prepare.outputs.version }}
      WLSAPLUS_VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - run: npm run version:apply
      - run: npm run capacitor:sync
      - name: Restore Android signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wlsaplus.jks"
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/wlsaplus.jks"
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi
      - name: Stage APK
        run: |
          mkdir -p release-assets
          apk_path="$(find android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$apk_path"
          cp "$apk_path" "release-assets/WLSAPlus-${WLSAPLUS_VERSION}-Android.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: release-assets/* }

  windows:
    needs: prepare
    runs-on: windows-latest
    env:
      WLSAPLUS_VERSION: ${{ needs.prepare.outputs.version }}
      PUBLISH_RELEASE: ${{ needs.prepare.outputs.publish }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run version:apply
      - run: npm test
      - name: Require a trusted signing certificate for releases
        if: env.PUBLISH_RELEASE == 'true' && (env.WINDOWS_CERTIFICATE_BASE64 == '' || env.WINDOWS_CERTIFICATE_PASSWORD == '')
        shell: pwsh
        run: throw 'A signed release requires WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD secrets.'
      - name: Restore Windows signing certificate
        if: env.WINDOWS_CERTIFICATE_BASE64 != '' && env.WINDOWS_CERTIFICATE_PASSWORD != ''
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'wlsaplus-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          "WINDOWS_CERTIFICATE_FILE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm run electron:make
      - name: Verify Windows Authenticode signatures
        if: env.WINDOWS_CERTIFICATE_BASE64 != '' && env.WINDOWS_CERTIFICATE_PASSWORD != ''
        shell: pwsh
        run: |
          $files = @(
            (Get-ChildItem out -Recurse -File -Filter WLSAPlus.exe | Where-Object FullName -Like '*WLSAPlus-win32-*' | Select-Object -First 1),
            (Get-ChildItem out/make -Recurse -File -Filter *.exe | Select-Object -First 1)
          )
          if ($files.Count -ne 2 -or $files -contains $null) { throw 'Could not find both the packaged app and setup executable.' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature on $($file.FullName): $($signature.Status)" }
            if (-not $signature.TimeStamperCertificate) { throw "Missing trusted timestamp on $($file.FullName)." }
            Write-Host "Verified $($file.Name)"
            Write-Host "Publisher: $($signature.SignerCertificate.Subject)"
            Write-Host "Certificate thumbprint: $($signature.SignerCertificate.Thumbprint)"
            Write-Host "Timestamp authority: $($signature.TimeStamperCertificate.Subject)"
          }
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets
          $setup = Get-ChildItem out/make -Recurse -File -Filter *.exe | Select-Object -First 1
          if (-not $setup) { throw 'Windows setup executable was not produced.' }
          Copy-Item -LiteralPath $setup.FullName -Destination "release-assets/WLSAPlus-$env:WLSAPLUS_VERSION-Windows-Setup.exe"
          Get-ChildItem out/make -Recurse -File -Filter *.nupkg | Copy-Item -Destination release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release-assets/*

  macos:
    needs: prepare
    runs-on: macos-latest
    env:
      WLSAPLUS_VERSION: ${{ needs.prepare.outputs.version }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run version:apply
      - name: Import Apple signing certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        run: |
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p actions "$RUNNER_TEMP/build.keychain"
          security default-keychain -s "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p actions "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$RUNNER_TEMP/build.keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$RUNNER_TEMP/build.keychain"
      - run: npm run electron:make
      - name: Stage macOS packages
        run: |
          mkdir -p release-assets
          dmg_path="$(find out/make -type f -name '*.dmg' | head -n 1)"
          zip_path="$(find out/make -type f -name '*.zip' | head -n 1)"
          test -n "$dmg_path" && cp "$dmg_path" "release-assets/WLSAPlus-${WLSAPLUS_VERSION}-macOS.dmg"
          test -n "$zip_path" && cp "$zip_path" "release-assets/WLSAPlus-${WLSAPLUS_VERSION}-macOS.zip"
          test -n "$dmg_path$zip_path"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release-assets/*

  release:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, android, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: WLSAPlus ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
