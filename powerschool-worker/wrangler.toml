name = "wlsaplus-powerschool-gateway"
main = "src/worker.js"
compatibility_date = "2026-09-03"
workers_dev = false

routes = [
  { pattern = "apiwlsaplus.02studio.xyz", custom_domain = true }
]

[vars]
ALLOWED_ORIGINS = "https://wlsap.02studio.xyz"
ALLOWED_PATH_PREFIXES = "/public/,/guardian/"
ALLOWED_METHODS = "GET,HEAD,POST"
SESSION_TTL_SECONDS = "1800"
MAX_REQUEST_BYTES = "262144"
MAX_RESPONSE_BYTES = "5242880"
SESSION_REQUESTS_PER_MINUTE = "120"

[[durable_objects.bindings]]
name = "POWERSCHOOL_SESSIONS"
class_name = "PowerSchoolSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PowerSchoolSession"]
